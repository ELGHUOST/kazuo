<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17133d">
<title>Kazuo · Swipe</title>
<link rel="preload" href="/static/fonts/dela-gothic-one.woff2" as="font" type="font/woff2" crossorigin>
{% raw %}
<style>
  @font-face {
    font-family: "Dela Gothic One";
    src: url("/static/fonts/dela-gothic-one.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    /* Les 6 couleurs de la page : change-les ici, tout suit */
    --ai: #17133d;      /* 藍 indigo : la nuit */
    --sumi: #0e0c1d;    /* 墨 encre : traits et contours */
    --washi: #fbf7ee;   /* 和紙 papier : la planche de manga */
    --shu: #ff3b2f;     /* 朱 vermillon : le sceau, « retenue » */
    --neon: #3ef2ff;    /* néon : la touche cyber */
    --kin: #f5c542;     /* 金 or : le salaire, l'annulation */
    --gris: #4a4668;    /* texte secondaire sur papier */
    --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans CJK JP", system-ui, sans-serif;
    --texte: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    background: radial-gradient(120% 55% at 50% 112%, rgba(62, 242, 255, .22), transparent 62%), var(--ai);
    color: var(--washi); font-family: var(--texte); -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before {        /* trame de points (screentone) qui monte du bas de l'écran */
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle, rgba(251, 247, 238, .11) 1.2px, transparent 1.7px) 0 0 / 8px 8px;
    -webkit-mask-image: linear-gradient(to top, #000, transparent 55%);
            mask-image: linear-gradient(to top, #000, transparent 55%);
  }
  :focus-visible { outline: 3px solid var(--neon); outline-offset: 3px; }

  header, #pile, #actions { width: min(100% - 2rem, 34rem); margin-inline: auto; }

  /* ---------- En-tête ---------- */
  header { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .55rem .8rem; padding: .7rem 0 .4rem; }
  .logo { font-family: var(--display); font-size: clamp(1.3rem, 6vw, 1.65rem); line-height: 1; color: var(--washi); text-decoration: none;
          letter-spacing: .04em; text-shadow: 3px 3px 0 var(--shu); }
  header nav { justify-self: end; display: flex; gap: .2rem; }
  header nav a { padding: .3rem .75rem; border-radius: 999px; color: #cfcaf0; font-weight: 600; text-decoration: none; }
  header nav a[aria-current="page"] { background: var(--washi); color: var(--sumi); }
  .reglages { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .6rem; }
  .reglages form { display: flex; gap: .4rem; min-width: 0; }
  header select { min-width: 0; font: inherit; font-size: 16px; padding: .25rem .35rem; border: 2px solid rgba(251, 247, 238, .28);
                  border-radius: 8px; background: #221d55; color: var(--washi); }

  /* ---------- La pile et la carte (une planche de manga) ---------- */
  #pile { position: relative; flex: 1; min-height: 0; margin-top: 1rem; }
  .reste { position: absolute; top: -.85rem; left: .9rem; z-index: 6; padding: .1rem .7rem; border: 2.5px solid var(--sumi);
           border-radius: 999px; background: var(--washi); color: var(--sumi); box-shadow: 3px 3px 0 var(--shu);
           font-size: .82rem; font-weight: 700; pointer-events: none; transform: rotate(-3deg); }
  .reste b { margin-right: .2rem; font-family: var(--display); font-weight: 400; }
  .carte {
    --ombre: var(--neon); --force: 0;
    position: absolute; inset: 0 10px 10px 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--washi); color: var(--sumi); border: 3px solid var(--sumi); border-radius: 10px;
    box-shadow: calc(7px + var(--force) * 6px) calc(7px + var(--force) * 6px) 0 var(--ombre);
    transition: transform .25s ease, opacity .25s ease, box-shadow .2s ease; will-change: transform;
    user-select: none; -webkit-user-select: none;
  }
  .carte[data-sens="droite"] { --ombre: var(--shu); }
  .carte[data-sens="gauche"] { --ombre: #8c89b3; }
  .carte, .carte * { touch-action: pan-y; }
  .carte a { -webkit-user-drag: none; }
  .carte.dessous { transform: scale(.95) translateY(12px); opacity: .55; pointer-events: none; }
  .carte.glisse { transition: none; }
  .carte.sortie { pointer-events: none; }
  .carte.envol { opacity: 0; transition: transform .35s ease-in, opacity .35s ease-in; }

  .entete { position: relative; padding: 1rem 1rem .85rem; border-bottom: 3px solid var(--sumi); }
  .entete::before {     /* trame derrière le sceau, qui s'efface sous le titre */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(14, 12, 29, .2) 1.1px, transparent 1.6px) 0 0 / 7px 7px;
    -webkit-mask-image: linear-gradient(to left, #000 10%, transparent 75%);
            mask-image: linear-gradient(to left, #000 10%, transparent 75%);
  }
  .entete > * { position: relative; }
  .ligne { display: flex; align-items: flex-start; gap: .8rem; }
  .titres { flex: 1; min-width: 0; }
  .titre { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.22rem; line-height: 1.25; overflow-wrap: anywhere; }
  .societe { margin: .35rem 0 0; font-weight: 700; color: var(--gris); }

  .sceau { flex: none; display: flex; flex-direction: column; align-items: center; gap: .25rem; transform: rotate(-6deg); }
  .sceau b { display: grid; place-items: center; width: 3.4rem; height: 3.4rem; border: 3px solid var(--sumi); border-radius: 50%;
             background: var(--teinte); color: var(--encre-sceau);
             box-shadow: inset 0 0 0 3px var(--teinte), inset 0 0 0 5px var(--washi);
             font-family: var(--display); font-weight: 400; font-size: 1.75rem; line-height: 1; }
  .sceau span { font-size: .75rem; font-weight: 700; color: var(--gris); }
  .n-haute   { --teinte: var(--shu);  --encre-sceau: var(--washi); }
  .n-moyenne { --teinte: var(--kin);  --encre-sceau: var(--sumi); }
  .n-basse   { --teinte: var(--neon); --encre-sceau: var(--sumi); }
  .n-faible  { --teinte: #c9c6dd;     --encre-sceau: var(--sumi); }

  .puces { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .75rem; }
  .puce { padding: .1rem .55rem; border: 2px solid var(--sumi); border-radius: 999px; background: var(--washi);
          font-size: .78rem; font-weight: 600; }
  .puce.salaire { background: var(--kin); }
  .puce.profil { background: var(--ai); border-color: var(--ai); color: var(--washi); }
  .puce:empty, .parole:empty, .facteurs:empty { display: none; }

  .corps { flex: 1; min-height: 0; overflow-y: auto; padding: 1.15rem 1rem 1rem; }
  .parole {             /* l'avis de l'IA, en bulle de manga qui pointe vers le sceau */
    position: relative; margin: 0 0 1rem; padding: .65rem .85rem; background: #fff;
    border: 2.5px solid var(--sumi); border-radius: 20px; font-size: .95rem; line-height: 1.45;
  }
  .parole::after { content: ""; position: absolute; top: -9px; right: 2.3rem; width: 15px; height: 15px; background: #fff;
                   border-top: 2.5px solid var(--sumi); border-left: 2.5px solid var(--sumi); transform: rotate(45deg); }
  .facteurs { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem 1.2rem; }
  .facteur { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .8rem; color: var(--gris); }
  .barre { display: flex; gap: 3px; }
  .barre i { width: 15px; height: 9px; border: 1.5px solid var(--sumi); border-radius: 2px; transform: skewX(-20deg); }
  .barre i.plein { background: var(--sumi); }
  .description { margin: 1rem 0 0; color: #3c3860; font-size: .92rem; line-height: 1.55; white-space: pre-line; }

  .pied { padding: .7rem 1rem .8rem; border-top: 3px solid var(--sumi); }
  .lien { display: block; padding: .6rem; border-radius: 8px; background: var(--sumi); color: var(--washi);
          font-family: var(--display); font-weight: 400; text-align: center; text-decoration: none; letter-spacing: .03em; }

  /* ---------- Tampons (sceaux japonais) et lignes de vitesse ---------- */
  .tampon { position: absolute; top: 5.2rem; z-index: 3; display: flex; flex-direction: column; align-items: center;
            padding: .45rem .55rem .35rem; border: 4px double; border-radius: 8px; background: rgba(251, 247, 238, .9);
            opacity: 0; pointer-events: none; transform: rotate(var(--angle)); }
  .tampon b { writing-mode: vertical-rl; font-family: var(--display); font-weight: 400; font-size: 2.1rem; line-height: 1; letter-spacing: .08em; }
  .tampon span { margin-top: .3rem; font-size: .72rem; font-weight: 800; }
  .tampon.like { --angle: -12deg; left: 1.2rem; color: var(--shu); }
  .tampon.nope { --angle: 12deg; right: 1.2rem; color: var(--sumi); }
  .tampon.frappe { opacity: 1 !important; animation: frappe .2s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes frappe {
    from { opacity: 0; transform: scale(2.4) rotate(var(--angle)); }
    to   { opacity: 1; transform: scale(1) rotate(var(--angle)); }
  }
  #impact {             /* 集中線 : les lignes de vitesse des mangas, une fraction de seconde */
    --trait: var(--shu);
    position: absolute; inset: -15%; z-index: 5; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg at 50% 45%, var(--trait) 0deg .7deg, transparent .7deg 4.5deg);
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, transparent 0 36%, #000 72%);
            mask-image: radial-gradient(ellipse at 50% 45%, transparent 0 36%, #000 72%);
  }
  #impact[data-sens="nope"] { --trait: var(--neon); }
  #impact.actif { animation: impact .45s ease-out; }
  @keyframes impact {
    0%   { opacity: 0; transform: scale(1.25); }
    20%  { opacity: .85; }
    100% { opacity: 0; transform: scale(1); }
  }

  /* ---------- Pile vide ---------- */
  #vide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 1rem; text-align: center; color: #cfcaf0; }
  .kanji-fin { margin: 0; font-family: var(--display); font-size: 6rem; line-height: 1; color: var(--washi); text-shadow: 6px 6px 0 var(--shu); }
  #vide .gros { margin: .7rem 0 .3rem; font-family: var(--display); font-size: 1.3rem; color: var(--washi); }
  #vide p { margin: .2rem 0; }
  #vide a { margin-top: .6rem; color: var(--neon); }

  /* ---------- Boutons ---------- */
  #actions { display: flex; justify-content: center; align-items: center; gap: 1.5rem; padding: 1rem 0 1.1rem; }
  #actions button { display: grid; place-items: center; padding: 0; border: 3px solid var(--sumi); border-radius: 50%;
                    cursor: pointer; touch-action: manipulation; transition: transform .08s, box-shadow .08s; }
  #actions svg { width: 52%; height: 52%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #b-nope { width: 4rem; height: 4rem; background: var(--washi); color: var(--sumi); box-shadow: 4px 4px 0 var(--neon); }
  #b-like { width: 4.7rem; height: 4.7rem; background: var(--shu); color: var(--washi); box-shadow: 4px 4px 0 var(--kin); }
  #b-like svg { fill: currentColor; stroke: none; }
  #b-annuler { width: 3rem; height: 3rem; background: var(--ai); color: var(--kin); border-color: var(--kin); }
  #actions button:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: none; }
  #actions button { position: relative; }
  .compte { position: absolute; top: -.4rem; right: -.45rem; display: grid; place-items: center; min-width: 1.7rem; height: 1.7rem;
            padding: 0 .35rem; border: 2.5px solid var(--sumi); border-radius: 999px; background: var(--washi); color: var(--sumi);
            font-family: var(--display); font-size: .8rem; line-height: 1; }
  #b-like .compte { background: var(--kin); }
  #actions button:disabled { opacity: .35; cursor: default; }

  #bulle { position: fixed; left: 50%; bottom: calc(7rem + env(safe-area-inset-bottom)); z-index: 10; max-width: 90vw;
           padding: .5rem 1rem; border: 2.5px solid var(--sumi); border-radius: 8px; background: var(--washi); color: var(--sumi);
           box-shadow: 4px 4px 0 var(--shu); font-size: .9rem; font-weight: 600;
           opacity: 0; transform: translateX(-50%); transition: opacity .2s; pointer-events: none; }
  #bulle.visible { opacity: 1; }

  /* Écran d'ordinateur : une carte plus large, des textes plus grands. Le téléphone n'est pas concerné. */
  @media (min-width: 900px) {
    header, #pile, #actions { width: min(100% - 4rem, 46rem); }
    .entete { padding: 1.4rem 1.6rem 1.1rem; }
    .corps { padding: 1.4rem 1.6rem 1.2rem; }
    .pied { padding: .9rem 1.6rem 1rem; }
    .titre { font-size: 1.6rem; }
    .societe { font-size: 1.1rem; }
    .sceau b { width: 4.2rem; height: 4.2rem; font-size: 2.2rem; }
    .sceau span { font-size: .85rem; }
    .puce { font-size: .88rem; }
    .parole { font-size: 1.05rem; }
    .facteur { font-size: .9rem; }
    .description { font-size: 1rem; }
    .tampon { top: 6.5rem; }
    .tampon b { font-size: 2.8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .carte, .carte.envol { transition: none !important; }
    .tampon.frappe { animation: none; }
    #impact { display: none; }
  }
</style>
{% endraw %}
</head>
<body data-profil="{{ profil if profil is not none else '' }}" data-note-min="{{ note_min }}">
<header>
  <a class="logo" href="/" title="Offres">カズオ</a>
  <nav aria-label="Menu principal"><a href="/">Offres</a><a href="/swipe" aria-current="page">Swipe</a><a href="/profils">Profils</a></nav>
  <div class="reglages">
  <form method="get" action="/swipe">
    <select name="profil" aria-label="Profil">
      <option value="">Tous profils</option>
      {% for p in profils %}
      <option value="{{ p.id }}"{% if p.id == profil %} selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
    <select name="note_min" aria-label="Note minimale">
      {% for n, libelle in [(7, "Note ≥ 7"), (5, "Note ≥ 5"), (0, "Toutes notes")] %}
      <option value="{{ n }}"{% if n == note_min %} selected{% endif %}>{{ libelle }}</option>
      {% endfor %}
    </select>
    <noscript><button>OK</button></noscript>
  </form>
  </div>
</header>

<main id="pile">
  <span class="reste" id="reste" hidden><b id="c-trier">–</b>à trier</span>
  <div id="vide">
    <p class="kanji-fin" id="vide-kanji" aria-hidden="true" hidden>完</p>
    <p class="gros" id="vide-titre">Chargement des offres…</p>
    <p id="vide-texte"></p>
    <a id="vide-lien" hidden></a>
  </div>
  <div id="impact" aria-hidden="true"></div>
</main>

<nav id="actions">
  <button id="b-nope" type="button" aria-label="Écarter (flèche gauche)" title="Écarter (←)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    <span class="compte" id="c-ecart" hidden></span>
  </button>
  <button id="b-annuler" type="button" aria-label="Annuler le dernier choix (Z)" title="Annuler (Z)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12h-3"/></svg>
  </button>
  <button id="b-like" type="button" aria-label="Retenir (flèche droite)" title="Retenir (→)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.3 12.9a4.6 4.6 0 0 1 6.5-6.5L12 7.6l1.2-1.2a4.6 4.6 0 0 1 6.5 6.5z"/></svg>
    <span class="compte" id="c-ret" hidden></span>
  </button>
</nav>
<div id="bulle" role="status"></div>

<template id="modele-carte">
  <article class="carte">
    <div class="tampon like" aria-hidden="true"><b>採用</b><span>Retenue</span></div>
    <div class="tampon nope" aria-hidden="true"><b>見送り</b><span>Écartée</span></div>
    <div class="entete">
      <div class="ligne">
        <div class="titres">
          <h2 class="titre"></h2>
          <p class="societe"></p>
        </div>
        <div class="sceau" role="img"><b></b><span></span></div>
      </div>
      <div class="puces">
        <span class="puce lieu"></span><span class="puce contrat"></span><span class="puce salaire"></span>
        <span class="puce date"></span><span class="puce doublons"></span><span class="puce profil"></span>
      </div>
    </div>
    <div class="corps">
      <p class="parole"></p>
      <div class="facteurs"></div>
      <p class="description"></p>
    </div>
    <div class="pied"><a class="lien" target="_blank" rel="noopener noreferrer" draggable="false">Ouvrir l'annonce</a></div>
  </article>
</template>

{% raw %}
<script>
"use strict";
const API = "/api/swipe";
const PROFIL = document.body.dataset.profil === "" ? null : Number(document.body.dataset.profil);
const NOTE_MIN = Number(document.body.dataset.noteMin);
const SEUIL = 0.3;                   // part de la largeur de la carte à dépasser pour valider un swipe
const KANJI = ["〇", "一", "二", "三", "四", "五", "六", "七", "八", "九", "満"];   // 満 : comme dans 満点, la note parfaite
const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = id => document.getElementById(id);
const pile = $("pile"), vide = $("vide"), impact = $("impact"), modele = $("modele-carte");
const bLike = $("b-like"), bNope = $("b-nope"), bAnnuler = $("b-annuler"), bulle = $("bulle");

let deck = [];                       // cartes à venir ; deck[0] est la carte du dessus
const historique = [];               // cartes triées pendant cette visite, pour pouvoir les remettre
const vues = new Set();              // cartes déjà reçues ("profil:offre"), pour ne jamais empiler de doublon
let file = Promise.resolve();        // les appels au serveur partent un par un, dans l'ordre des gestes
let chargement = null, fini = false, enErreur = false, minuterie = null;

const cle = c => `${c.profile_id}:${c.offer_id}`;

/* ---------- Dialogue avec l'API ---------- */

function enFile(tache) {
  const p = file.then(tache);
  file = p.catch(() => {});          // un échec ne bloque pas les appels suivants
  return p;
}

async function appel(url, options = {}) {
  const r = await fetch(url, { ...options, headers: { "Content-Type": "application/json" } });
  if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { status: r.status });
  return r.json();
}

function requete(extra = {}) {
  const q = new URLSearchParams({ note_min: NOTE_MIN, ...extra });
  if (PROFIL !== null) q.set("profil", PROFIL);
  return q;
}

function charger() {
  if (chargement || fini) return;
  const limite = Math.min(100, deck.length + 25);
  chargement = enFile(() => appel(`${API}/cartes?${requete({ limite })}`))
    .then(cartes => {
      enErreur = false;
      const nouvelles = cartes.filter(c => !vues.has(cle(c)));
      for (const c of nouvelles) { vues.add(cle(c)); deck.push(c); }
      if (nouvelles.length === 0) fini = true;
    })
    .catch(() => { enErreur = true; message("Impossible de charger les offres"); })
    .finally(() => { chargement = null; afficher(); });
  afficher();
}

async function majCompteurs() {
  try {
    const s = await appel(`${API}/stats?${requete()}`);
    $("c-trier").textContent = s.a_trier;
    $("reste").hidden = s.a_trier === 0;
    for (const [id, n, mot] of [["c-ret", s.retenues, "retenue"], ["c-ecart", s.ecartees, "écartée"]]) {
      const pastille = $(id);         // le nombre de décisions, posé sur le bouton correspondant
      pastille.textContent = n;
      pastille.title = `${n} ${mot}${n > 1 ? "s" : ""}`;
      pastille.hidden = n === 0;
    }
  } catch { /* simple indicateur : il sera remis à jour au prochain geste */ }
}

function message(texte) {
  bulle.textContent = texte;
  bulle.classList.add("visible");
  clearTimeout(minuterie);
  minuterie = setTimeout(() => bulle.classList.remove("visible"), 2500);
}

/* ---------- Affichage : seules les 2 premières cartes existent dans la page ---------- */

function depuis(iso) {
  const d = new Date(String(iso).replace(" ", "T"));
  if (!iso || isNaN(d)) return "";
  const jours = Math.floor((Date.now() - d) / 86400000);
  return jours < 1 ? "aujourd'hui" : jours === 1 ? "hier" : `il y a ${jours} j`;
}

function facteurs(conteneur, f) {
  if (!f) return;
  const lignes = [["métier", f.metier, 3], ["niveau", f.niveau, 2], ["compétences", f.competences, 3], ["contrat", f.contrat, 1]];
  for (const [nom, valeur, max] of lignes) {
    const ligne = document.createElement("div");
    ligne.className = "facteur";
    const libelle = document.createElement("span");
    libelle.textContent = nom;
    const barre = document.createElement("span");
    barre.className = "barre";
    barre.setAttribute("role", "img");
    barre.setAttribute("aria-label", `${valeur} sur ${max}`);
    for (let i = 0; i < max; i++) {
      const case_ = document.createElement("i");
      if (i < valeur) case_.className = "plein";
      barre.append(case_);
    }
    ligne.append(libelle, barre);
    conteneur.append(ligne);
  }
}

function noeud(c) {
  if (c.noeud) return c.noeud;
  const n = modele.content.firstElementChild.cloneNode(true);
  const champ = (sel, texte) => { n.querySelector(sel).textContent = texte || ""; };   // jamais innerHTML
  const sceau = n.querySelector(".sceau");
  sceau.classList.add(c.score >= 8 ? "n-haute" : c.score >= 6 ? "n-moyenne" : c.score >= 4 ? "n-basse" : "n-faible");
  sceau.setAttribute("aria-label", `Note : ${c.score} sur 10`);
  champ(".sceau b", KANJI[c.score] ?? String(c.score));
  champ(".sceau span", `${c.score}/10`);
  champ(".titre", c.title);
  champ(".societe", c.company || "Entreprise non précisée");
  champ(".lieu", c.location);
  champ(".contrat", c.contract);
  champ(".salaire", c.salary);
  champ(".date", depuis(c.published_at));
  champ(".doublons", c.nb > 1 && `publiée ${c.nb} fois`);
  champ(".profil", PROFIL === null && c.profil);
  champ(".parole", c.explanation);
  facteurs(n.querySelector(".facteurs"), c.factors);
  champ(".description", c.description && (c.description.length >= 700 ? c.description + " …" : c.description));
  const lien = n.querySelector(".lien");
  if (c.url) lien.href = c.url; else lien.parentElement.remove();
  brancherGeste(n, c);
  return (c.noeud = n);
}

function afficher() {
  const [dessus, dessous] = deck;
  for (const n of pile.querySelectorAll(".carte:not(.sortie)"))
    if (n !== dessus?.noeud && n !== dessous?.noeud) n.remove();
  if (dessous) {
    const n = noeud(dessous);
    n.classList.add("dessous");
    if (!n.isConnected) pile.prepend(n);     // en premier dans le code = dessous à l'écran
  }
  if (dessus) {
    const n = noeud(dessus);
    n.classList.remove("dessous");
    if (!n.isConnected) impact.before(n);    // juste sous les lignes de vitesse = dessus
  }
  vide.hidden = deck.length > 0;
  if (!deck.length) {
    const etat = chargement ? "charge" : enErreur ? "erreur" : "fini";
    $("vide-kanji").hidden = etat !== "fini";
    $("vide-titre").textContent = { charge: "Chargement des offres…", erreur: "Serveur injoignable", fini: "Tout est trié." }[etat];
    $("vide-texte").textContent = { charge: "", erreur: "Vérifie ta connexion, puis recharge la page.",
                                    fini: "La prochaine collecte passe à 7 h 30." }[etat];
    const lien = $("vide-lien");
    lien.hidden = etat !== "fini" || NOTE_MIN === 0;
    lien.textContent = `Afficher aussi les notes sous ${NOTE_MIN}`;
    lien.href = `/swipe?${requete({ note_min: 0 })}`;
  }
  bLike.disabled = bNope.disabled = deck.length === 0;
}

/* ---------- Geste de glissement (souris, doigt ou stylet : les mêmes « pointer events ») ---------- */

function brancherGeste(n, c) {
  let id = null, x0 = 0, y0 = 0, dx = 0, t0 = 0, actif = false;
  const tampons = { like: n.querySelector(".tampon.like"), nope: n.querySelector(".tampon.nope") };
  const repos = () => {
    n.style.transform = "";
    n.style.setProperty("--force", 0);
    delete n.dataset.sens;
    tampons.like.style.opacity = tampons.nope.style.opacity = 0;
  };

  n.addEventListener("pointerdown", e => {
    if (deck[0] !== c || e.button > 0) return;
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; t0 = performance.now(); actif = false;
  });

  n.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    dx = e.clientX - x0;
    if (!actif) {
      // on ne prend la main que si le geste est franchement horizontal (sinon c'est un défilement)
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(e.clientY - y0)) return;
      actif = true;
      n.setPointerCapture(id);
      n.classList.add("glisse");
    }
    const force = Math.min(1, Math.abs(dx) / (n.offsetWidth * SEUIL));
    n.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    n.style.setProperty("--force", force.toFixed(2));
    n.dataset.sens = dx > 0 ? "droite" : "gauche";
    tampons.like.style.opacity = dx > 0 ? force : 0;
    tampons.nope.style.opacity = dx < 0 ? force : 0;
  });

  const fin = e => {
    if (e.pointerId !== id) return;
    id = null;
    if (!actif) return;
    n.classList.remove("glisse");
    const vitesse = Math.abs(dx) / (performance.now() - t0);     // pixels par milliseconde
    const valide = e.type === "pointerup" &&
      (Math.abs(dx) > n.offsetWidth * SEUIL || (vitesse > 0.5 && Math.abs(dx) > 50));
    if (valide) decider(dx > 0 ? "like" : "nope");
    else repos();
    // le relâchement d'un glissement ne doit pas compter comme un clic (sur le lien, par exemple)
    const bloque = ev => { ev.preventDefault(); ev.stopPropagation(); };
    n.addEventListener("click", bloque, true);
    setTimeout(() => n.removeEventListener("click", bloque, true), 50);
  };
  n.addEventListener("pointerup", fin);
  n.addEventListener("pointercancel", fin);
}

/* ---------- Décider, annuler ---------- */

function frapper(decision) {         // les lignes de vitesse, rejouées à chaque décision
  if (REDUIT) return;
  impact.dataset.sens = decision;
  impact.classList.remove("actif");
  void impact.offsetWidth;           // oblige le navigateur à repartir de zéro
  impact.classList.add("actif");
}

function decider(decision) {
  const c = deck.shift();
  if (!c) return;
  const sens = decision === "like" ? 1 : -1;
  const n = noeud(c);
  c.noeud = null;                          // en cas d'annulation, la carte sera reconstruite à neuf
  n.classList.remove("glisse");
  n.classList.add("sortie");               // elle quitte la pile : elle n'écoute plus les gestes
  n.dataset.sens = sens > 0 ? "droite" : "gauche";
  n.querySelector(`.tampon.${decision}`).classList.add("frappe");   // le tampon s'abat…
  frapper(decision);
  setTimeout(() => {                       // … puis la carte s'envole
    n.classList.add("envol");
    n.style.transform = `translateX(${sens * 140}%) rotate(${sens * 20}deg)`;
  }, REDUIT ? 0 : 170);
  setTimeout(() => n.remove(), REDUIT ? 50 : 560);
  historique.push({ carte: c, decision });
  afficher();
  if (deck.length < 5) charger();
  enFile(() => appel(API, { method: "POST",
      body: JSON.stringify({ offer_id: c.offer_id, profile_id: c.profile_id, decision }) }))
    .then(majCompteurs)
    .catch(e => {
      oublier(c);
      if (e.status === 404) message("Offre déjà triée ailleurs : ignorée");
      else { message("Échec réseau : l'offre revient sur la pile"); remettre(c, sens); }
    });
}

function oublier(c) {
  const i = historique.findIndex(h => h.carte === c);
  if (i >= 0) historique.splice(i, 1);
}

function remettre(c, sens) {
  deck.unshift(c);
  afficher();
  const n = c.noeud;
  n.classList.add("glisse");                                   // point de départ hors de l'écran, sans animation…
  n.style.transform = `translateX(${sens * 140}%) rotate(${sens * 20}deg)`;
  n.getBoundingClientRect();                                   // … que le navigateur doit enregistrer…
  n.classList.remove("glisse");
  n.style.transform = "";                                      // … puis la carte revient au centre, animée
}

function annuler() {
  enFile(() => appel(`${API}/annuler`, { method: "POST", body: JSON.stringify({ profile_id: PROFIL }) }))
    .then(r => {
      const i = historique.findLastIndex(h =>
        h.carte.profile_id === r.profile_id && r.offres.includes(h.carte.offer_id));
      if (i >= 0) {
        const [h] = historique.splice(i, 1);
        remettre(h.carte, h.decision === "like" ? 1 : -1);
      } else {
        message("Décision annulée (elle datait d'avant cette visite)");
        recommencer();
      }
      majCompteurs();
    })
    .catch(e => message(e.status === 404 ? "Rien à annuler" : "Échec de l'annulation"));
}

function recommencer() {
  pile.querySelectorAll(".carte").forEach(n => n.remove());
  deck.forEach(c => { c.noeud = null; });
  deck = [];
  vues.clear();
  fini = false;
  charger();
}

/* ---------- Boutons, clavier, filtres ---------- */

bLike.addEventListener("click", () => decider("like"));
bNope.addEventListener("click", () => decider("nope"));
bAnnuler.addEventListener("click", annuler);
document.addEventListener("keydown", e => {
  if (e.repeat || e.target.closest("select, input, textarea")) return;
  if (e.key === "ArrowRight") decider("like");
  else if (e.key === "ArrowLeft") decider("nope");
  else if (e.key === "z" || e.key === "Backspace") annuler();
});
document.querySelectorAll("header select").forEach(s => s.addEventListener("change", () => s.form.submit()));

charger();
majCompteurs();
</script>
